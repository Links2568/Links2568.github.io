<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Presenter</title>
<link rel="stylesheet" href="dist/deck.css?v=aeee8b63">
<style>
  html, body { overflow: auto; background: var(--bg); }
  body { margin: 0; padding: 36px 44px; font-family: Inter, "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
  .where { color: var(--ink-3); font-size: 18px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; }
  h1 { margin: 10px 0 0; font-size: 44px; letter-spacing: -0.035em; }
  .clock { text-align: right; }
  .clock .time { font-size: 64px; font-weight: 760; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; line-height: 1; }
  .clock .pace { margin-top: 8px; font-size: 18px; font-weight: 650; }
  .ahead { color: var(--accent); }
  .behind { color: var(--interf); }
  .notes { display: grid; gap: 18px; margin: 30px 0; padding: 28px 32px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); font-size: 28px; line-height: 1.5; max-width: 1200px; }
  .notes p { margin: 0; color: var(--ink); }
  .notes p.then { color: var(--ink-3); font-size: 20px; line-height: 1.4; }
  .notes p b { margin-right: 10px; color: var(--accent); font-size: 18px; letter-spacing: 0.08em; }
  .notes .do { color: var(--accent); }
  .step-title { margin: 6px 0 0; color: var(--ink-2); font-size: 26px; font-weight: 600; }
  footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; color: var(--ink-2); font-size: 20px; }
  button { padding: 12px 22px; border: 1px solid var(--line-strong); border-radius: 12px; background: transparent; color: var(--ink); font: inherit; font-weight: 650; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .next b { color: var(--ink); }
</style>
</head>
<body>
<header>
  <div>
    <div class="where" id="where">Waiting for the deck…</div>
    <h1 id="title">Press S in the deck window</h1>
    <p class="step-title" id="step-title"></p>
  </div>
  <div class="clock">
    <div class="time" id="time">0:00</div>
    <div class="pace" id="pace">Timer starts on the first slide change</div>
  </div>
</header>
<div class="notes" id="notes"></div>
<footer>
  <div class="next">Next: <b id="next">—</b></div>
  <div>
    <button id="prev">← Back</button>
    <button id="forward">Next →</button>
    <button id="reset">Reset timer</button>
  </div>
</footer>
<script>
  // Talks to the deck window through postMessage (works from file:// too).
  const deck = window.opener;
  let state = null;
  let started = null;
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  function send(action) {
    deck?.postMessage({ type: "nav", action }, "*");
  }

  window.addEventListener("message", (event) => {
    if (event.data?.type !== "state") return;
    if (state && (event.data.index !== state.index || event.data.step !== state.step) && started === null) {
      started = performance.now();
    }
    state = event.data;
    document.documentElement.dataset.theme = state.theme;
    const planned = state.stepDuration ?? state.duration;
    $("where").textContent = `Slide ${state.index + 1} / ${state.total} · step ${state.step + 1} / ${state.steps} · planned ${planned}s${state.stepDuration === null ? " for the slide" : ""}`;
    $("title").textContent = state.title;
    $("step-title").textContent = state.stepTitle ?? "";
    // One page per step: only this step's notes, with stage directions (in
    // parentheses) marked; then one dim line of what the next step says.
    const notes = $("notes");
    notes.innerHTML = "";
    const add = (text, cls, label) => {
      const p = document.createElement("p");
      p.className = cls;
      if (label) {
        const b = document.createElement("b");
        b.textContent = label;
        p.append(b);
      }
      for (const piece of text.split(/(\([^)]*\))/)) {
        if (/^\(.*\)$/.test(piece)) {
          const span = document.createElement("span");
          span.className = "do";
          span.textContent = piece;
          p.append(span);
        } else if (piece) {
          p.append(piece);
        }
      }
      notes.append(p);
    };
    const here = state.parts.filter((part) => part.step === state.step);
    if (here.length) {
      for (const part of here) add(part.text, "now", state.steps > 1 ? `STEP ${state.step + 1}` : "");
    } else {
      // A step without notes of its own: the last thing said still stands.
      const before = state.parts.filter((part) => part.step < state.step).at(-1);
      add(before ? before.text : "(No notes for this step.)", "then", before ? `STEP ${before.step + 1}, CONTINUED` : "");
    }
    const after = state.parts.find((part) => part.step === state.step + 1);
    if (after) {
      add(after.text.length > 140 ? `${after.text.slice(0, 140)}…` : after.text, "then", "NEXT");
    }
    $("next").textContent = state.next;
  });

  setInterval(() => {
    if (!state) return;
    const elapsed = started === null ? 0 : (performance.now() - started) / 1000;
    $("time").textContent = fmt(elapsed);
    // Where the plan puts the start of this step (of this slide, without
    // per-step times).
    const plannedStart = state.plannedStart ?? state.plan.slice(0, state.index).reduce((sum, s) => sum + s.duration, 0);
    const total = state.plan.reduce((sum, s) => sum + s.duration, 0);
    if (started !== null) {
      const delta = elapsed - plannedStart;
      const pace = $("pace");
      pace.className = `pace ${delta > 15 ? "behind" : "ahead"}`;
      pace.textContent = `${delta > 0 ? "+" : "−"}${fmt(Math.abs(delta))} vs plan · plan total ${fmt(total)}`;
    }
  }, 250);

  $("prev").addEventListener("click", () => send("prev"));
  $("forward").addEventListener("click", () => send("next"));
  $("reset").addEventListener("click", () => { started = performance.now(); });
  window.addEventListener("keydown", (event) => {
    if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(event.key)) { event.preventDefault(); send("next"); }
    if (["ArrowLeft", "ArrowUp", "PageUp"].includes(event.key)) { event.preventDefault(); send("prev"); }
    // Letters go on to the deck window, which decides whether one is a key of
    // the talk (A plays the step's sound there). The physical key, so it
    // works with an input method on.
    const letter = /^Key([A-Z])$/.exec(event.code || "");
    if (letter && !event.metaKey && !event.ctrlKey && !event.altKey && !event.repeat) {
      deck?.postMessage({ type: "key", key: letter[1].toLowerCase() }, "*");
    }
  });
  deck?.postMessage({ type: "hello" }, "*");
</script>
</body>
</html>
